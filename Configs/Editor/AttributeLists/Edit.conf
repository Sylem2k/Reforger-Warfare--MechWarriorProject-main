// Warlord-specific additions to the GM Edit Entity attribute list.
// Same attribute-class / slider / spinbox style as CGS-Auto-Turrets.
SCR_EditorAttributeList {
 m_aAttributes + {
  RW_WarlordGMWeaponsEditorAttribute "{AB12112600000010}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{AB12112600000011}" {
    Name "Warlord Weapons"
    Description "All, Missiles Only, Lasers Only, Cannons Only, or Hold Fire. Applies immediately."
   }
   m_CategoryConfig "{AB12112600000001}Configs/Editor/AttributeCategories/RW_Warlord.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  RW_WarlordGMInaccuracyEditorAttribute "{AB12112600000012}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{AB12112600000013}" {
    Name "Warlord Inaccuracy"
    Description "1.0 = original accuracy; 3.0 = much less accurate. Applies to gunners, flak and Omni guns."
   }
   m_CategoryConfig "{AB12112600000001}Configs/Editor/AttributeCategories/RW_Warlord.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues "{AB12112600000014}" {
    m_fMin 1
    m_fMax 5
    m_fStep 0.25
    m_iDecimals 2
   }
  }
  RW_WarlordGMMovementEditorAttribute "{AB12112600000015}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{AB12112600000016}" {
    Name "Warlord Movement"
    Description "Patrol; stop and hold current position; or move only to GM waypoints assigned to the hidden-pilot AI group."
   }
   m_CategoryConfig "{AB12112600000001}Configs/Editor/AttributeCategories/RW_Warlord.conf"
   m_Layout "{C3A25A51777A99BD}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Spinbox.layout"
  }
  RW_WarlordGMArrivalEditorAttribute "{AB12112600000017}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{AB12112600000018}" {
    Name "Waypoint Arrival (m)"
    Description "How close the Warlord must reach before stopping at a GM Move waypoint."
   }
   m_CategoryConfig "{AB12112600000001}Configs/Editor/AttributeCategories/RW_Warlord.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues "{AB12112600000019}" {
    m_fMin 3
    m_fMax 35
    m_fStep 1
    m_iDecimals 0
   }
  }
 }
